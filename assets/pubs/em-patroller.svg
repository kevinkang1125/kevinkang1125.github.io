<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" width="600" height="375" role="img" aria-label="EM-Patroller placeholder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155e75"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#ffffff" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="375" fill="url(#g)"/>
  <rect width="600" height="375" fill="url(#grid)"/>
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".85">
    <circle cx="300" cy="200" r="60"  stroke-opacity=".5"/>
    <circle cx="300" cy="200" r="105" stroke-opacity=".35"/>
    <circle cx="300" cy="200" r="150" stroke-opacity=".2"/>
    <path d="M300 200 170 110M300 200 445 120M300 200 430 290M300 200 175 285" stroke-opacity=".45"/>
    <circle cx="300" cy="200" r="14" fill="#ffffff" fill-opacity=".95" stroke="none"/>
  </g>
  <text x="300" y="46" fill="#ffffff" fill-opacity=".92" font-family="Inter,system-ui,sans-serif"
        font-size="21" font-weight="600" text-anchor="middle">EM-Patroller</text>
  <text x="300" y="68" fill="#ffffff" fill-opacity=".55" font-family="Inter,system-ui,sans-serif"
        font-size="12" text-anchor="middle">replace with your figure</text>
